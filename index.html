<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CS2 TERMINAL v4.1.2</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --green:#00ff41; --dim:#00aa2a; --red:#ff3333;
    --yellow:#ffcc00; --panel:#0d1a0f; --border:#1a3a1f; --text:#c8ffc8;
  }
  body {
    background:#0a0a0a; color:var(--green);
    font-family:'Share Tech Mono',monospace;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  body::before {
    content:''; position:fixed; inset:0; pointer-events:none; z-index:999;
    background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.15) 2px,rgba(0,0,0,0.15) 4px);
  }
  body::after {
    content:''; position:fixed; inset:0; pointer-events:none; z-index:998;
    background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,0.7) 100%);
  }
  .terminal {
    width:860px; max-width:98vw; background:var(--panel);
    border:1px solid var(--border);
    box-shadow:0 0 20px rgba(0,255,65,0.1),0 0 60px rgba(0,255,65,0.05),inset 0 0 30px rgba(0,0,0,0.5);
    display:flex; flex-direction:column; height:92vh; overflow:hidden;
  }
  .title-bar {
    background:#0a150b; border-bottom:1px solid var(--border);
    padding:6px 14px; display:flex; align-items:center; gap:10px;
    font-size:11px; color:var(--dim); letter-spacing:2px; text-transform:uppercase;
  }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--dim); box-shadow:0 0 6px var(--green); animation:blink 2s infinite; }
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
  .title-bar-right { margin-left:auto; font-size:10px; opacity:0.5; }
  .screen { flex:1; overflow-y:auto; padding:20px; scroll-behavior:smooth; }
  .screen::-webkit-scrollbar{width:4px}
  .screen::-webkit-scrollbar-thumb{background:var(--dim)}
  .line { line-height:1.6; margin-bottom:2px; font-size:14px; animation:fadein 0.1s ease; }
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  .line.dim{color:var(--dim);font-size:12px}
  .line.red{color:var(--red)}
  .line.yellow{color:var(--yellow)}
  .line.white{color:var(--text)}
  .line.big{font-family:'VT323',monospace;font-size:22px;color:var(--green)}
  .line.sep{color:#1e4a22}
  .input-bar {
    border-top:1px solid var(--border); padding:10px 14px;
    display:flex; align-items:center; gap:8px; background:#08100a;
  }
  .prompt{color:var(--dim);font-size:13px;white-space:nowrap}
  #cmd-input {
    flex:1; background:transparent; border:none; outline:none;
    color:var(--green); font-family:'Share Tech Mono',monospace; font-size:14px; caret-color:var(--green);
  }
  #cmd-input::placeholder{color:#1a4020}
  .status-bar {
    border-top:1px solid var(--border); padding:4px 14px;
    display:flex; justify-content:space-between;
    font-size:10px; color:#1e5c25; letter-spacing:1px; background:#08100a;
  }
  .money-display{color:var(--yellow)}
  @keyframes glitch {
    0%{transform:translate(0);filter:none}
    10%{transform:translate(-4px,2px);filter:hue-rotate(90deg)}
    20%{transform:translate(4px,-2px);filter:brightness(2)}
    30%{transform:translate(-2px,4px);filter:hue-rotate(180deg)}
    40%{transform:translate(2px,-4px);filter:none}
    50%{transform:translate(-6px,0);filter:invert(0.3)}
    60%{transform:translate(6px,2px);filter:hue-rotate(270deg)}
    70%{transform:translate(0,-2px);filter:brightness(0.3)}
    80%{transform:translate(-2px,2px);filter:none}
    90%{transform:translate(2px,0);filter:hue-rotate(45deg)}
    100%{transform:translate(0);filter:none}
  }
  .glitching{animation:glitch 0.1s infinite}
  @keyframes fadeout{from{opacity:1}to{opacity:0}}
  .dying{animation:fadeout 1.5s ease forwards}
  .item-block {
    border:1px solid #1a4a1f; padding:10px 14px; margin:8px 0;
    background:rgba(0,40,10,0.3);
  }
  .item-name{color:var(--yellow);font-size:15px}
  .item-rarity{font-size:11px;margin-bottom:4px}
  .item-price{color:#00ff88;font-size:14px}
  .item-float{color:#888;font-size:11px}
  .rarity-consumer{color:#aaa}
  .rarity-industrial{color:#6496e1}
  .rarity-milspec{color:#4b69cd}
  .rarity-restricted{color:#8847ff}
  .rarity-classified{color:#d32ce6}
  .rarity-covert{color:#eb4b4b}
  .rarity-gold{color:#e4ae39}
  .hint-box {
    border:1px dashed #1a4020; padding:8px 12px; margin:6px 0;
    font-size:12px; color:#2a7030;
  }
</style>
</head>
<body>
<div class="terminal" id="terminal">
  <div class="title-bar">
    <div class="dot"></div>
    <span>CS2 TRADE NETWORK // ENCRYPTED CHANNEL</span>
    <span class="title-bar-right" id="session-display">SESSION: ----</span>
  </div>
  <div class="screen" id="screen"></div>
  <div class="input-bar" id="input-bar">
    <span class="prompt" id="prompt-label">PASS &gt;</span>
    <input type="password" id="cmd-input" placeholder="enter access code..." autocomplete="off" autofocus />
  </div>
  <div class="status-bar">
    <span>CONN: SECURE • ENC: AES-256 • ANON: ACTIVE</span>
    <span>BALANCE: $<span class="money-display" id="money-display">0.00</span></span>
  </div>
</div>
<script>
// ═══════════════════════════════════════════════
// SHARED STORAGE KEY
// ═══════════════════════════════════════════════

const SHARED_KEY = 'cs2_shared';

function derivePassword(sid) {
  return String((sid * 31 + 7) % 9999).padStart(4,'0');
}

function newSessionId() {
  return Math.floor(1000 + Math.random() * 8999);
}

function loadShared() {
  try { return JSON.parse(localStorage.getItem(SHARED_KEY)) || null; }
  catch { return null; }
}

function saveShared(obj) {
  localStorage.setItem(SHARED_KEY, JSON.stringify(obj));
}

function getShared() {
  const s = loadShared();
  if (!s) {
    const fresh = { sessionId:newSessionId(), dead:false, money:0, inventory:[], prices:{} };
    saveShared(fresh);
    return fresh;
  }
  return s;
}

// ── MONEY ──
function getMoney() {
  return getShared().money || 0;
}

function setMoney(v) {
  const s = getShared();
  s.money = Math.max(0, Math.round(v * 100) / 100);
  saveShared(s);
}

// ── INVENTORY ──
function addToInventory(item) {
  const s = getShared();
  if (!s.inventory) s.inventory = [];

  s.inventory.push({
    ...item,
    boughtAt: item.price,
    acquiredTime: Date.now(),
    id: `${Date.now()}-${Math.random().toString(36).slice(2)}`
  });

  saveShared(s);
}

// ── ITEMS ──
const BASE_ITEMS = [
  { name:"AK-47 | Redline", rarity:"classified", wear:"Field-Tested", price:24.50, float:"0.2341" },
  { name:"AWP | Asiimov", rarity:"covert", wear:"Battle-Scarred", price:67.00, float:"0.7812" },
  { name:"M4A4 | Howl", rarity:"gold", wear:"Minimal Wear", price:1840.00, float:"0.1102" },
  { name:"Karambit | Fade", rarity:"gold", wear:"Factory New", price:2100.00, float:"0.0322" },
];

function getCurrentPrice(name, base) {
  const s = getShared();
  return (s.prices && typeof s.prices[name] === 'number') ? s.prices[name] : base;
}

function pickItem() {
  const base = BASE_ITEMS[Math.floor(Math.random() * BASE_ITEMS.length)];
  return { ...base, price:getCurrentPrice(base.name, base.price) };
}

// ── STATE ──
let STATE = {
  phase:'login',
  rejects:0,
  currentItem:null,
  sessionId:null,
  correctPassword:null
};

function bootState() {
  const s = getShared();
  STATE.sessionId = s.sessionId;
  STATE.correctPassword = derivePassword(s.sessionId);
  STATE.phase = s.dead ? 'dead_login' : 'login';
}

function markDead() {
  const s = getShared();
  s.sessionId = newSessionId();
  s.dead = true;
  saveShared(s);

  STATE.sessionId = s.sessionId;
  STATE.correctPassword = derivePassword(s.sessionId);
}

function markAlive() {
  const s = getShared();
  s.dead = false;
  saveShared(s);
}

// ── DOM ──
const screen = document.getElementById('screen');
const input = document.getElementById('cmd-input');
const promptLabel = document.getElementById('prompt-label');
const moneyDisplay = document.getElementById('money-display');
const sessionDisplay = document.getElementById('session-display');
const terminal = document.getElementById('terminal');

// ── DISPLAY ──
function updateMoneyDisplay() {
  moneyDisplay.textContent = getMoney().toFixed(2);
}

// ── SAFE PRINT ──
function print(text, cls='', delay=0) {
  return new Promise(res => {
    setTimeout(() => {
      const d = document.createElement('div');
      d.className = 'line' + (cls ? ' '+cls : '');
      d.textContent = text;
      screen.appendChild(d);
      screen.scrollTop = screen.scrollHeight;
      res();
    }, delay);
  });
}

// ── CORE LOGIC FIXES ──

// ❗ FIX: BUY now actually costs money
async function handleBuy() {
  if (!STATE.currentItem) return;

  const price = STATE.currentItem.price;
  const money = getMoney();

  if (money < price) {
    await print('  [SYS] Insufficient funds.', 'red');
    return;
  }

  setMoney(money - price);
  addToInventory(STATE.currentItem);

  await print(`[SYS] Purchased ${STATE.currentItem.name}`, 'yellow');
  await print(`  -$${price.toFixed(2)} deducted`, 'dim');

  await triggerCrash('TRANSACTION ANOMALY — HONEYPOT DETECTED');
}

// ❗ FIX: reject safely handles null item + floating precision
async function handleReject() {
  if (!STATE.currentItem) return;

  const bonus = Math.round(STATE.currentItem.price * 0.2 * 100) / 100;
  setMoney(getMoney() + bonus);

  STATE.rejects++;

  await print(`[VENDOR]: rejected...`, 'dim');
  await print(`  +$${bonus.toFixed(2)}`, 'dim');

  if (STATE.rejects >= 10) {
    await triggerCrash('EXCESSIVE REJECTIONS DETECTED');
  } else {
    await offerItem();
  }
}

// ❗ FIX: state-safe item handling
async function offerItem() {
  if (STATE.phase !== 'chat') return;

  STATE.currentItem = pickItem();

  await print(`[VENDOR]: new offer incoming...`, 'white');
  await print(`  ${STATE.currentItem.name} - $${STATE.currentItem.price.toFixed(2)}`, 'yellow');
}

// ❗ FIX: state consistency
async function triggerCrash(reason) {
  STATE.phase = 'dead';
  input.disabled = true;

  await print(`[!] ${reason}`, 'red');

  const s = getShared();
  s.dead = true;
  saveShared(s);

  await showDeadLogin();
}

// ── INPUT HANDLER ──
input.addEventListener('keydown', async (e) => {
  if (e.key !== 'Enter') return;

  const val = input.value.trim();
  input.value = '';

  if (STATE.phase === 'login' || STATE.phase === 'dead_login') {
    if (val === STATE.correctPassword) {
      STATE.phase = 'chat';
      markAlive();
      await print('[ACCESS GRANTED]', 'green');
      await offerItem();
    } else {
      await print('ACCESS DENIED', 'red');
    }
    return;
  }

  if (STATE.phase === 'chat') {
    if (val === 'buy') await handleBuy();
    else if (val === 'pass') await handleReject();
  }
});

// ── INIT ──
bootState();
updateMoneyDisplay();
</script>
</body>
</html>
